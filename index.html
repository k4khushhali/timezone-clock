<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timezone</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="background">
      <div class="row">
        <!-- United Kingdome Timezone -->
        <div class="column">
          <h1 class="title">UK London</h1>
          <canvas id="ukTimeZone" height="400"></canvas>
          <time class="digital-clock" id="ukDigitalTime" data-timezone="Europe/London" aria-label="Current time in UK London">--:--:--</time>
        </div>
          <!-- India Timezone -->
        <div class="column">
          <h1 class="title">India Kolkatta</h1>
          <canvas id="indiaTimeZone" height="400"></canvas>
          <time class="digital-clock" id="indiaDigitalTime" data-timezone="Asia/Kolkata" aria-label="Current time in India Kolkata">--:--:--</time>
        </div>
          <!-- USA Florida Timezone -->
        <div class="column">
          <h1 class="title">USA Florida</h1>
          <canvas id="usaTimeZone" height="400"></canvas>
          <time class="digital-clock" id="usaDigitalTime" data-timezone="America/New_York" aria-label="Current time in USA Florida">--:--:--</time>
        </div>

        <section class="comparison" aria-labelledby="comparisonTitle">
          <h2 id="comparisonTitle">Compare Timezones</h2>
          <p class="comparison-description">Enter a local time to see when it happens in another location.</p>
          <div class="comparison-controls">
            <label>
              Time in
              <select id="sourceTimezone">
                <option value="Europe/London">London</option>
                <option value="Asia/Kolkata">India</option>
                <option value="America/New_York">Florida</option>
              </select>
            </label>
            <label>
              Date and time
              <input id="comparisonDateTime" type="datetime-local">
            </label>
            <label>
              Show time in
              <select id="targetTimezone">
                <option value="Asia/Kolkata">India</option>
                <option value="Europe/London">London</option>
                <option value="America/New_York">Florida</option>
              </select>
            </label>
          </div>
          <p id="comparisonResult" class="comparison-result" aria-live="polite">Choose a date and time to compare.</p>
        </section>
      </div>
    </div>

    <!-- jQuery -->
    <script src="jquery-3.4.1.min.js"></script>
    <!-- Custome -->
    <script src="./main.js"></script>
  </body>
</html>
