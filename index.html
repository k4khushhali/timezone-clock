<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timezone</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <div class="background">
      <div class="row">
        <!-- London Timezone -->
        <div class="column">
          <h1 class="title">London</h1>
          <canvas id="ukTimeZone" height="400"></canvas>
          <time class="digital-clock" id="ukDigitalTime" data-timezone="Europe/London" aria-label="Current time in London">--:--:--</time>
        </div>
          <!-- India Timezone -->
        <div class="column">
          <h1 class="title">India</h1>
          <canvas id="indiaTimeZone" height="400"></canvas>
          <time class="digital-clock" id="indiaDigitalTime" data-timezone="Asia/Kolkata" aria-label="Current time in India Kolkata">--:--:--</time>
        </div>
            <!-- USA Eastern Timezone -->
        <div class="column">
                <h1 class="title">USA <span class="usa-timezone-control">
              <select id="usaTimezone" aria-label="USA timezone">
                <option value="America/New_York">EST</option>
                <option value="America/Chicago">CST</option>
                <option value="America/Denver">MST</option>
                <option value="America/Los_Angeles">PST</option>
              </select>
                </span></h1>
            <canvas id="usaTimeZone" height="400"></canvas>
            <time class="digital-clock" id="usaDigitalTime" data-timezone="America/New_York" aria-label="Current time in USA EST">--:--:--</time>
        </div>
      </div>

      <section class="comparison" aria-labelledby="comparisonTitle">
        <h2 id="comparisonTitle">Timezone Comparison</h2>
        <p class="comparison-description">Choose a timezone and time to see the equivalent time in the other locations.</p>
        <div class="comparison-controls">
          <label>
            Timezone
            <select id="sourceTimezone">
              <option value="Europe/London">London</option>
              <option value="Asia/Kolkata">India</option>
              <option value="usa">USA</option>
            </select>
          </label>
          <label>
            Time
            <span class="time-selectors">
              <select id="comparisonHour" aria-label="Hour">
                <option value="">Hour</option>
              </select>
              <select id="comparisonMinute" aria-label="Minute">
                <option value="">Min</option>
              </select>
              <select id="comparisonMeridiem" aria-label="AM or PM">
                <option value="">AM/PM</option>
                <option>AM</option>
                <option>PM</option>
              </select>
            </span>
          </label>
        </div>
        <div id="comparisonResult" class="comparison-result" aria-live="polite">Choose a time to compare.</div>
      </section>
    </div>

    <!-- jQuery -->
    <script src="jquery-3.4.1.min.js"></script>
    <!-- Custome -->
    <script src="./main.js"></script>
  </body>
</html>
